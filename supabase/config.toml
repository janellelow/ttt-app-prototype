# Minimal Supabase CLI config for this project.
# Run `supabase link --project-ref <your-ref>` once; the CLI fills in the rest.

project_id = "ttt-app"

[functions.telegram-auth]
# This function is how people sign in, so it is called before they have a
# session. It checks Telegram's signature itself instead.
verify_jwt = false

[auth]
# Accounts are only created by the telegram-auth function.
enable_signup = false

[auth.email]
enable_signup = false
